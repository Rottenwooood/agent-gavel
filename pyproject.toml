[project]
name = "agent-gavel"
version = "0.2.3"
description = "验证驱动的多端操作框架：动作发出去，程序断言判成败，省掉一次模型往返"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Rottenwooood" }]
keywords = ["mcp", "dom", "atspi", "browser", "automation", "agent", "cdp", "web"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "mcp[cli]>=2.1.1",
    "websockets>=17.1",
    "psutil>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "playwright>=1.50",
]

# agent-gavel 是 MCP server（stdio 模式），opencode 等客户端通过
# `uvx agent-gavel` 拉起。桌面(AT-SPI)通道依赖 computer-use-linux
# (npm 全局安装)，不是 Python 依赖——纯 DOM 用法无需安装它。

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 环境里可能装了 ROS 的 pytest 插件（launch_testing/ament_*），它们会因缺依赖
# 在 pytest 启动时炸掉。显式禁用这些非本项目插件；pytest-asyncio 仍正常自动加载。
addopts = """-p no:launch_testing -p no:launch_ros -p no:ament_lint
 -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright -p no:ament_xmllint"""

[project.scripts]
agent-gavel = "agent_gavel.main:main"

[project.urls]
Homepage = "https://github.com/Rottenwooood/agent-gavel"
Repository = "https://github.com/Rottenwooood/agent-gavel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 标准包结构：agent_gavel/（含 channels/{dom,desktop} 及随包模板 JSON）。
# packages 递归打包包内全部文件（含 .json 模板），无需 force-include。
[tool.hatch.build.targets.wheel]
packages = ["agent_gavel"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_gavel/**",
    "*.sh",
    "tests/*.py",
    "docs/*.md",
    "third_party/**",
    "AGENTS.md",
    "README.md",
    "LICENSE",
]
