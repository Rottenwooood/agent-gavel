[project]
name = "agent-gavel"
version = "0.3.0"
description = "验证驱动的浏览器操作框架：动作发出去，程序断言判成败，省掉一次模型往返"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Rottenwooood" }]
keywords = ["mcp", "browser", "automation", "agent", "playwright", "web", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "mcp[cli]>=2.1.1",
    "psutil>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "playwright>=1.50",
]

# agent-gavel 是 MCP server（stdio 模式），opencode 等客户端通过
# `uvx agent-gavel` 或 run-mcp.sh 拉起。浏览器由 Playwright 自管（默认用系统
# Chrome）。旧的 DOM/Desktop 通道已归档到仓库根 legacy/，不打包、不运行。

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 环境里可能装了 ROS 的 pytest 插件（launch_testing/ament_*），它们会因缺依赖
# 在 pytest 启动时炸掉。显式禁用这些非本项目插件；pytest-asyncio 仍正常自动加载。
addopts = """-p no:launch_testing -p no:launch_ros -p no:ament_lint
 -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright -p no:ament_xmllint"""

[project.scripts]
agent-gavel = "agent_gavel.main:main"

[project.urls]
Homepage = "https://github.com/Rottenwooood/agent-gavel"
Repository = "https://github.com/Rottenwooood/agent-gavel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 标准包结构：只打包 agent_gavel/（新 Playwright runtime 的工具/资源模型/工作流）。
# 旧通道在仓库根 legacy/，不在 packages 内 → 不打包、不随发行分发。
[tool.hatch.build.targets.wheel]
packages = ["agent_gavel"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_gavel/**",
    "*.sh",
    "tests/*.py",
    "tests/webapp/**",
    "docs/*.md",
    "AGENTS.md",
    "README.md",
    "LICENSE",
]
# 注：legacy/ 与 third_party/ 不进 sdist（legacy 仅仓库内归档；third_party 是
# 本机优化二进制，见 third_party/README）。
