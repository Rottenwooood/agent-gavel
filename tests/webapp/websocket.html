<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WebSocket</title></head>
<body>
  <div id="msg">idle</div>
  <script>
    try {
      var ws = new WebSocket('ws://' + location.host + '/ws');
      ws.onmessage = function (e) { document.getElementById('msg').textContent = e.data; };
      ws.onopen = function () { ws.send('ping'); };
    } catch (e) {}
  </script>
</body>
</html>
